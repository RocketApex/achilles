name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  BUNDLE_FROZEN: "true"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "3.4.13"
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Run Rails tests
        run: bin/rails test

      - name: Run system tests
        run: bin/rails test:system

      - name: Check JavaScript modules
        run: |
          for file in $(find app/javascript/achilles test/dummy/app/javascript -name '*.js' -print); do
            node --input-type=module --check < "$file"
          done

      - name: Precompile dummy app assets
        run: RAILS_ENV=test bin/rails app:assets:precompile
