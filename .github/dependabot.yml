version: 2
updates:
  - package-ecosystem: bundler
    # Resolve the test bundle with its own Ruby version.
    directory: "/gemfiles"
    schedule:
      interval: weekly
    groups:
      ruby-patches:
        update-types:
          - patch
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
